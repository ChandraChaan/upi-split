<!DOCTYPE html>
<html lang="te">
<head>
  <!-- Replaced by flutter build's --base-href; served from /shop/. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kirana Mitra Shop: sell, khata and wholesale purchases for your kirana shop.">
  <meta name="theme-color" content="#0F766E">

  <!-- Added to the iPhone home screen, it opens full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kirana Shop">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kirana Shop</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4FBF9; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 16px -apple-system, system-ui, sans-serif; color: #0F766E;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <noscript>Kirana Shop needs JavaScript. Please turn it on and reload.</noscript>
  <!-- Shown while the app downloads; main.dart removes it after the first frame. -->
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>లోడ్ అవుతోంది… Loading…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
